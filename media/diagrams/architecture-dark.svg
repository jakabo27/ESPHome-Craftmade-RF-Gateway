<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1115"/>
      <stop offset="100%" stop-color="#161822"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e222b"/>
      <stop offset="100%" stop-color="#14171f"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowTeal" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowRose" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#2dd4bf"/>
    </marker>
    <marker id="arrowRose" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#f43f5e"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#eab308"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="540" fill="url(#bgGrad)"/>

  <!-- Precision Blueprint Grid -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <path d="M0 60 H960 M0 120 H960 M0 180 H960 M0 240 H960 M0 300 H960 M0 360 H960 M0 420 H960 M0 480 H960" />
    <path d="M60 0 V540 M120 0 V540 M180 0 V540 M240 0 V540 M300 0 V540 M360 0 V540 M420 0 V540 M480 0 V540 M540 0 V540 M600 0 V540 M660 0 V540 M720 0 V540 M780 0 V540 M840 0 V540 M900 0 V540" />
  </g>

  <!-- Header Banner -->
  <g transform="translate(40, 44)">
    <rect x="-10" y="-8" width="4" height="42" fill="#2dd4bf" rx="2"/>
    <text font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="700" fill="#f8fafc" letter-spacing="0.3">ESPHome Craftmade Ceiling Fan &amp; Light RF Gateway</text>
    <text y="24" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#94a3b8">Dual-Control Architecture: Home Assistant &amp; Original Wall Remote Concurrency</text>
  </g>

  <!-- ==================== FLOW CONNECTIONS (ARROWS) ==================== -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- 1. Wi-Fi Path: Home Assistant (x=275, y=187) -> ESPHome Gateway (x=355, y=187) -->
    <path d="M 275 187 L 355 187" stroke="#3b82f6" stroke-width="3" marker-end="url(#arrowBlue)"/>

    <!-- 2. RF Path: ESPHome Gateway (x=625, y=187) -> Ceiling Fan (x=720, y=250) -->
    <path d="M 625 187 C 670 187, 680 245, 720 250" stroke="#2dd4bf" stroke-width="3.5" marker-end="url(#arrowTeal)" filter="url(#glowTeal)"/>

    <!-- 3. RF Path: Wall Remote (x=275, y=415) -> Ceiling Fan (x=720, y=340) -->
    <path d="M 275 415 C 450 415, 560 340, 720 340" stroke="#f43f5e" stroke-width="3.5" marker-end="url(#arrowRose)" filter="url(#glowRose)"/>

    <!-- 4. Historic Sniffer Path: Wall Remote (x=160, y=320) -> ESPHome Gateway (x=450, y=280) -->
    <path d="M 160 320 C 160 255, 360 260, 440 280" stroke="#eab308" stroke-width="2.2" stroke-dasharray="6,4" marker-end="url(#arrowAmber)"/>
  </g>

  <!-- Wire Badges & Labels -->
  <!-- Wi-Fi Badge (above the line) -->
  <g transform="translate(282, 142)">
    <rect x="0" y="0" width="66" height="26" rx="4" fill="#172554" stroke="#2563eb" stroke-width="1.2"/>
    <text x="33" y="17" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#93c5fd" text-anchor="middle">Wi-Fi</text>
  </g>

  <!-- Gateway RF Badge -->
  <g transform="translate(632, 155)">
    <rect x="0" y="0" width="82" height="34" rx="5" fill="#132e2b" stroke="#0d9488" stroke-width="1.2"/>
    <text x="41" y="15" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#5eead4" text-anchor="middle">303.875 MHz</text>
    <text x="41" y="27" font-family="system-ui, sans-serif" font-size="9.5" fill="#99f6e4" text-anchor="middle">OOK Bursts (6x)</text>
  </g>

  <!-- Wall Remote RF Badge -->
  <g transform="translate(440, 365)">
    <rect x="0" y="0" width="135" height="36" rx="6" fill="#371520" stroke="#be123c" stroke-width="1.2"/>
    <text x="67" y="15" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#fda4af" text-anchor="middle">303.875 MHz RF</text>
    <text x="67" y="29" font-family="system-ui, sans-serif" font-size="9.5" fill="#fecdd3" text-anchor="middle">Original Wall Remote</text>
  </g>

  <!-- Sniffer Path Badge -->
  <g transform="translate(210, 246)">
    <rect x="0" y="0" width="145" height="24" rx="4" fill="#2a2211" stroke="#ca8a04" stroke-width="1"/>
    <text x="72" y="16" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#fde047" text-anchor="middle">Sniffed Protocol (Phase 1)</text>
  </g>


  <!-- ==================== NODE 1: HOME ASSISTANT ==================== -->
  <g id="node_ha" transform="translate(40, 95)">
    <!-- Container -->
    <rect x="0" y="0" width="235" height="185" rx="10" fill="url(#cardGrad)" stroke="#2563eb" stroke-width="1.5"/>
    
    <!-- Header -->
    <rect x="0" y="0" width="235" height="44" rx="10" fill="#1e2d4a"/>
    <line x1="0" y1="44" x2="235" y2="44" stroke="#2563eb" stroke-width="1.5"/>
    <circle cx="24" cy="22" r="10" fill="#2563eb"/>
    <path d="M 19 23 L 24 17 L 29 23 M 21 22 V 27 H 27 V 22" stroke="#ffffff" stroke-width="1.3" fill="none"/>
    <text x="42" y="27" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Home Assistant</text>

    <!-- Subtitle -->
    <text x="16" y="66" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#60a5fa">SMART HOME PLATFORM</text>

    <!-- Bullets -->
    <text x="16" y="92" font-family="monospace" font-size="12.5" font-weight="600" fill="#e2e8f0">• fan.living_room_fan</text>
    <text x="16" y="116" font-family="monospace" font-size="12.5" font-weight="600" fill="#e2e8f0">• light.living_room_fan_light</text>
    <text x="16" y="142" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">• Native ESPHome API (:6053)</text>
    <text x="16" y="165" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#38bdf8">• Sub-10ms instant response</text>
  </g>


  <!-- ==================== NODE 2: ESPHOME GATEWAY ==================== -->
  <g id="node_gateway" transform="translate(355, 95)">
    <!-- Container -->
    <rect x="0" y="0" width="270" height="185" rx="10" fill="url(#cardGrad)" stroke="#0d9488" stroke-width="1.8"/>
    
    <!-- Header -->
    <rect x="0" y="0" width="270" height="44" rx="10" fill="#133330"/>
    <line x1="0" y1="44" x2="270" y2="44" stroke="#0d9488" stroke-width="1.5"/>
    <circle cx="24" cy="22" r="10" fill="#0d9488"/>
    <text x="24" y="26" font-family="monospace" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">RF</text>
    <text x="42" y="27" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff">ESPHome Gateway</text>

    <!-- Subtitle -->
    <text x="16" y="66" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#5eead4">SEEED XIAO ESP32-C6 + TI CC1101</text>

    <!-- Bullets -->
    <text x="16" y="92" font-family="system-ui, sans-serif" font-size="13" fill="#f1f5f9">• 303.875 MHz OOK synthesizer</text>
    <text x="16" y="116" font-family="system-ui, sans-serif" font-size="13" fill="#f1f5f9">• 6x timed burst repeat generator</text>
    <text x="16" y="142" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">• CC1101 automated idle (~1.5 mA)</text>
    <text x="16" y="165" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#4ade80">• Wi-Fi light modem sleep (&lt;15 mA)</text>
  </g>


  <!-- ==================== NODE 3: PHYSICAL WALL REMOTE ==================== -->
  <g id="node_remote" transform="translate(40, 320)">
    <!-- Container -->
    <rect x="0" y="0" width="235" height="185" rx="10" fill="url(#cardGrad)" stroke="#db2777" stroke-width="1.5"/>
    
    <!-- Header -->
    <rect x="0" y="0" width="235" height="44" rx="10" fill="#381928"/>
    <line x1="0" y1="44" x2="235" y2="44" stroke="#db2777" stroke-width="1.5"/>
    <circle cx="24" cy="22" r="10" fill="#db2777"/>
    <text x="24" y="26" font-family="monospace" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">TX</text>
    <text x="42" y="27" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Craftmade Wall Remote</text>

    <!-- Subtitle -->
    <text x="16" y="66" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#f472b6">ORIGINAL 7-BUTTON HARDWARE</text>

    <!-- Bullets -->
    <text x="16" y="92" font-family="system-ui, sans-serif" font-size="13" fill="#f1f5f9">• 7 physical tactile push buttons</text>
    <text x="16" y="116" font-family="system-ui, sans-serif" font-size="13" fill="#f1f5f9">• 303.875 MHz SAW resonator TX</text>
    <text x="16" y="142" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">• Powered by 12V A23 alkaline cell</text>
    <text x="16" y="165" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#fb7185">• 100% concurrent wall control</text>
  </g>


  <!-- ==================== NODE 4: CEILING FAN & LIGHT ==================== -->
  <g id="node_fan" transform="translate(720, 160)">
    <!-- Container -->
    <rect x="0" y="0" width="200" height="235" rx="10" fill="url(#cardGrad)" stroke="#475569" stroke-width="1.8"/>
    
    <!-- Header -->
    <rect x="0" y="0" width="200" height="44" rx="10" fill="#202736"/>
    <line x1="0" y1="44" x2="200" y2="44" stroke="#64748b" stroke-width="1.5"/>
    <circle cx="24" cy="22" r="10" fill="#475569"/>
    <path d="M 19 22 L 29 22 M 24 17 L 24 27" stroke="#ffffff" stroke-width="1.5"/>
    <text x="42" y="27" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Ceiling Fan &amp; Light</text>

    <!-- Subtitle -->
    <text x="16" y="66" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#94a3b8">CRAFTMADE APPLIANCE</text>

    <!-- Bullets -->
    <text x="16" y="92" font-family="system-ui, sans-serif" font-size="13" fill="#f1f5f9">• Canopy RF receiver module</text>
    <text x="16" y="116" font-family="system-ui, sans-serif" font-size="13" fill="#f1f5f9">• 3-Speed AC motor (Lo/Med/Hi)</text>
    <text x="16" y="142" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">• Reversible rotation relay</text>
    <text x="16" y="165" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">• Light fixture triac toggle</text>
    <text x="16" y="194" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#facc15">✓ Concurrently controlled</text>
    <text x="16" y="214" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">  by HA or Wall Remote</text>
  </g>

</svg>
